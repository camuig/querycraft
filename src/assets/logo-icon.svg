  <rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="#14161B"></rect>
  <g transform="translate(256.56 256.56) scale(5.1088)">
  <g fill="#F4F2ED">
    <circle cx="34" cy="18" r="6.5"></circle><circle cx="50" cy="18" r="6.5"></circle><circle cx="66" cy="18" r="6.5"></circle>
    <circle cx="18" cy="34" r="6.5"></circle><circle cx="82" cy="34" r="6.5"></circle>
    <circle cx="18" cy="50" r="6.5"></circle><circle cx="82" cy="50" r="6.5"></circle>
    <circle cx="18" cy="66" r="6.5"></circle><circle cx="82" cy="66" r="6.5"></circle>
    <circle cx="34" cy="82" r="6.5"></circle><circle cx="50" cy="82" r="6.5"></circle><circle cx="66" cy="82" r="6.5"></circle>
  </g>
  <g fill="#C8721F">
    <circle cx="64" cy="64" r="6.5"></circle><circle cx="82" cy="82" r="8"></circle>
  </g>
  </g>
</svg>
