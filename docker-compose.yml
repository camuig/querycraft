# Throwaway database servers for development and the live integration tests
# (src-tauri/tests/live_*.rs). Start what you need: `docker compose up -d postgres`.
services:
  mysql:
    image: mysql:8.0
    ports: ["33070:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: shop

  mariadb:
    image: mariadb:11
    ports: ["33073:3306"]
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_DATABASE: shop

  postgres:
    image: postgres:16
    ports: ["33071:5432"]
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: shop

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["33072:8123"]
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: secret
      CLICKHOUSE_DB: shop

  redis:
    image: redis:7
    ports: ["33076:6379"]
    command: ["redis-server", "--requirepass", "secret"]

  valkey:
    image: valkey/valkey:8
    ports: ["33077:6379"]
    command: ["valkey-server", "--requirepass", "secret"]

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # amd64-only image; runs under emulation on Apple Silicon hosts and is
    # slow to become healthy (roughly 30-60s).
    platform: linux/amd64
    ports: ["33078:1433"]
    environment:
      ACCEPT_EULA: "Y"
      # SQL Server rejects weak sa passwords: upper+lower+digit+symbol, 8+ chars.
      MSSQL_SA_PASSWORD: "Secret_123"
