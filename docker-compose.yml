# Throwaway database servers for development and the live integration tests
# (src-tauri/tests/live_*.rs). Start what you need: `docker compose up -d postgres`.
services:
  mysql:
    image: mysql:8.0
    ports: ["33070:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: shop

  mariadb:
    image: mariadb:11
    ports: ["33073:3306"]
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_DATABASE: shop

  postgres:
    image: postgres:16
    ports: ["33071:5432"]
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: shop

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["33072:8123"]
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: secret
      CLICKHOUSE_DB: shop
