[package]
name = "query-craft"
version = "0.2.0"
description = "Fast cross-platform desktop client for MySQL, MariaDB, PostgreSQL, ClickHouse and SQLite in the spirit of DataGrip"
authors = ["camuig"]
license = "Apache-2.0"
repository = "https://github.com/camuig/querycraft"
edition = "2021"

[lib]
name = "query_craft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "native-tls-tls"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
async-trait = "0.1"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
base64 = "0.22"
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
