name: Release

# Builds the installers for an existing tag and uploads them to the GitHub release with that tag.
# Called by release-please.yml after a release pull request is merged; can also be started by hand
# for a tag that already exists.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build, for example v0.2.0
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: Private key that signs the updater artifacts
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: Password of the private key (empty when the key has none)
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple') && 'x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # The bundler downloads the AppImage launcher (AppRun) with mode 0770 and copies it into the image
      # as AppRun.wrapped, so the AppImage fails with "Permission denied" when root mounts it and another
      # user starts it (firejail, the AppImage catalog tests). The bundler reuses a launcher that is already
      # in its cache, so seed one that everybody may run. Upstream: tauri-apps/tauri#16155.
      - name: Seed an AppImage launcher runnable by every user
        if: runner.os == 'Linux'
        run: |
          dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/AppRun-$(uname -m)" \
            "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-$(uname -m)"
          chmod 755 "$dir/AppRun-$(uname -m)"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (.sig); the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: QueryCraft ${{ inputs.tag }}
          releaseDraft: true
          prerelease: false
          # latest.json drives the in-app updater; on Windows it points at the NSIS installer.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      # The AppImage is already attached to the draft by now; failing here keeps the draft from being
      # published with an AppImage that other users cannot start.
      - name: Check that every user can start the AppImage
        if: runner.os == 'Linux'
        run: |
          cd "$RUNNER_TEMP"
          for image in "$GITHUB_WORKSPACE"/src-tauri/target/release/bundle/appimage/*.AppImage; do
            rm -rf squashfs-root
            "$image" --appimage-extract > /dev/null
            bad="$(find squashfs-root ! -type l \( ! -perm -o+r -o -perm -u+x ! -perm -o+x \))"
            if [ -n "$bad" ]; then
              echo "::error::$(basename "$image") has files that only their owner may use:"
              echo "$bad" | xargs ls -ld
              exit 1
            fi
          done
